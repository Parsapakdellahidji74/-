<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- هدر -->
    <header>
        <div class="logo">YouTube</div>
        <input type="text" placeholder="جستجو...">
        <div class="icons">🔔 👤</div>
    </header>

    <!-- سایدبار -->
    <aside>
        <ul>
            <li>🏠 خانه</li>
            <li>🔥 ترند</li>
            <li>📺 اشتراک‌ها</li>
            <li>🎵 موسیقی</li>
            <li>🎮 گیمینگ</li>
        </ul>
    </aside>

    <!-- بخش ویدیوها -->
    <main>
        <div class="videos">
            <div class="video">
                <img src="https://via.placeholder.com/300x170" alt="Video Thumbnail">
                <h3>عنوان ویدیو ۱</h3>
                <p>نام کانال</p>
            </div>
            <div class="video">
                <img src="https://via.placeholder.com/300x170" alt="Video Thumbnail">
                <h3>عنوان ویدیو ۲</h3>
                <p>نام کانال</p>
            </div>
            <div class="video">
                <img src="https://via.placeholder.com/300x170" alt="Video Thumbnail">
                <h3>عنوان ویدیو ۳</h3>
                <p>نام کانال</p>
            </div>
        </div>
    </main>
</body>
</html>
